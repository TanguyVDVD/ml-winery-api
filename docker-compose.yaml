# ML server: ml-api (the model) behind Caddy (HTTPS). Run from ml_api/ on the server.
#   docker compose build
#   docker compose run --rm ml-api python train.py data/peltier.csv "2026-11-03 17:39:14+00"
#   docker compose up -d

# At most 3 log files of 10 MB per container
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ml-api:
    logging: *logging
    build: .
    container_name: ml-api
    restart: unless-stopped
    environment:
      # Same value as ML_API_TOKEN in the .env of the Pi
      API_TOKEN: ${API_TOKEN:?API_TOKEN is missing in .env}
    volumes:
      - ./models:/app/models   # written by train.py, read by the API
      - ./data:/app/data:ro    # CSV exports of the Pi
    # No published port: only reachable through Caddy
    networks:
      - web

  caddy:
    logging: *logging
    image: caddy:2
    container_name: ml-caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is missing in .env}
    ports:
      - "80:80"     # needed by Let's Encrypt to deliver the certificate
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data   # certificates: kept across restarts
      - caddy_config:/config
    depends_on:
      - ml-api
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
