# ML server. Run from this folder on the server:
#   docker compose build
#   docker compose run --rm ml-api python train.py data/peltier.csv "2026-11-03 17:39:14+00"
#   docker compose up -d
# HTTPS is done by the reverse proxy already running on the server: point the
# domain to the port below, with HTTPS enabled (the Pi refuses plain http).

# At most 3 log files of 10 MB per container
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ml-api:
    logging: *logging
    build: .
    container_name: ml-api
    restart: unless-stopped
    environment:
      # Same value as ML_API_TOKEN in the .env of the Pi
      API_TOKEN: ${API_TOKEN:?API_TOKEN is missing in .env}
    ports:
      # 127.0.0.1: only programs of this server (the reverse proxy) can reach it,
      # not the Internet in plain http. If the proxy runs in Docker, see README.
      - "127.0.0.1:${ML_PORT:-8010}:8000"
    volumes:
      - ./models:/app/models   # written by train.py, read by the API
      - ./data:/app/data:ro    # CSV exports of the Pi
